<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>for jaan</title>
<style>
  :root{
    --green:#00ff41;
    --green-dim:#0a3d1a;
    --bg:#000;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:"Courier New", monospace;
  }
  #matrix{
    position:fixed; inset:0;
    display:block;
    background:var(--bg);
  }
  #skip{
    position:fixed; top:16px; right:16px;
    z-index:20;
    color:var(--green-dim);
    background:transparent;
    border:1px solid var(--green-dim);
    padding:6px 12px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:1px;
    cursor:pointer;
    opacity:0.6;
    transition:opacity .3s, color .3s, border-color .3s;
  }
  #skip:hover{ opacity:1; color:var(--green); border-color:var(--green); }

  #letter-wrap{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 2s ease;
    padding:24px;
  }
  #letter-wrap.show{ opacity:1; pointer-events:auto; }

  #letter{
    max-width:600px;
    width:100%;
    background:rgba(0,10,2,0.72);
    border:1px solid var(--green);
    box-shadow:0 0 25px rgba(0,255,65,0.25), inset 0 0 25px rgba(0,255,65,0.06);
    padding:36px 32px;
    color:var(--green);
    text-shadow:0 0 6px rgba(0,255,65,0.6);
    max-height:80vh;
    overflow-y:auto;
  }
  #letter h1{
    font-size:15px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0.8;
    margin-bottom:18px;
    border-bottom:1px dashed var(--green-dim);
    padding-bottom:10px;
  }
  #letter-body{
    font-size:15px;
    line-height:1.9;
    white-space:pre-wrap;
    min-height:1.9em;
  }
  #cursor{
    display:inline-block;
    width:8px; height:15px;
    background:var(--green);
    vertical-align:middle;
    margin-left:2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #sig{
    margin-top:26px;
    text-align:right;
    font-style:italic;
    opacity:0;
    transition:opacity 1.2s ease;
    font-size:15px;
  }
  #sig.show{ opacity:1; }

  #letter::-webkit-scrollbar{ width:6px; }
  #letter::-webkit-scrollbar-thumb{ background:var(--green-dim); }

  #hint{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    color:var(--green-dim);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    z-index:5;
    opacity:0.7;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<button id="skip">skip →</button>
<div id="hint">forming...</div>

<div id="letter-wrap">
  <div id="letter">
    <h1>&lt; a message, decrypted &gt;</h1>
    <div id="letter-body"><span id="cursor"></span></div>
    <div id="sig">— your dumbdumb</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let W, H, cols, drops, fontSize;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    fontSize = Math.max(14, Math.floor(W / 90));
    cols = Math.floor(W / fontSize);
    drops = new Array(cols).fill(0).map(()=> Math.random() * -50);
  }
  window.addEventListener('resize', resize);
  resize();

  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789<>/\\|+*-=ハートLOVE";
  const charArr = chars.split("");

  // Build a list of heart-shaped target points (pixel x/y + char) using the
  // classic parametric heart curve. These are drawn as a persistent overlay
  // once revealed, independent of the falling rain.
  function heartPoints(){
    const pts = [];
    const cx = W/2;
    const cy = H*0.46;
    const scale = Math.min(W, H) * 0.019;
    // dense outline
    for(let t = 0; t < Math.PI*2; t += 0.015){
      const x = 16*Math.pow(Math.sin(t),3);
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      pts.push({x: cx + x*scale, y: cy + y*scale});
    }
    // filled interior: scan a grid, keep points inside the curve
    const step = fontSize * 0.8;
    for(let gx = -18; gx <= 18; gx += step/scale){
      for(let gy = -16; gy <= 14; gy += step/scale){
        // point-in-heart test via the implicit heart inequality
        const xx = gx, yy = -gy;
        const val = Math.pow(xx*xx + yy*yy - 1, 3) - xx*xx*yy*yy*yy;
        if(val <= 0){
          pts.push({x: cx + gx*scale, y: cy + gy*scale});
        }
      }
    }
    return pts;
  }

  let heartPts = heartPoints();
  window.addEventListener('resize', ()=>{ heartPts = heartPoints(); });
  const heartChars = "♥❤LOVE".split("");

  let frame = 0;
  const revealAt = 260; // frames until letter starts appearing

  function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(0,0,W,H);
    ctx.font = fontSize + "px monospace";

    for(let i=0; i<cols; i++){
      const text = charArr[Math.floor(Math.random()*charArr.length)];
      const x = i * fontSize;
      const rowIndex = Math.floor(drops[i]);
      const y = rowIndex * fontSize;

      ctx.fillStyle = "#00ff41";
      ctx.fillText(text, x, y);

      if(y > H && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }

    // Persistent heart overlay, fades in once the rain has been running a bit
    if(frame > 60){
      const heartAlpha = Math.min(1, (frame - 60) / 90);
      ctx.save();
      ctx.globalAlpha = heartAlpha;
      ctx.fillStyle = "#ff2d5e";
      ctx.shadowColor = "#ff2d5e";
      ctx.shadowBlur = 10;
      for(let p = 0; p < heartPts.length; p++){
        const pt = heartPts[p];
        const ch = heartChars[(p + frame/6 | 0) % heartChars.length];
        ctx.fillText(ch.length ? ch[0] : "♥", pt.x, pt.y);
      }
      ctx.restore();
    }

    frame++;
    if(frame === revealAt){
      document.getElementById('hint').style.opacity = '0';
      startLetter();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---- Letter typewriter ----
  const letterText =
`My jaan,

your dumb dumb here so I thought something different and sci fi like yk hehe. since I have hacked you for the first time hehehe

I just wanted to say thank you for everyhting you have done for me especially thank you for loving me and acceoting the very flawed  and annoying oerson i am. I love you so so much unconditionally and you have my full attention alwayss. Thank you for being there through everyhting and making me become your man as I am today. Most importantly thank you being the cause of me living today and I will live it for you.

I LOVE YOU SOOO MUCH MY JAAN AND ALWAYS WILL MWAHH`;

  let started = false;
  function startLetter(){
    if(started) return;
    started = true;
    const wrap = document.getElementById('letter-wrap');
    const body = document.getElementById('letter-body');
    const cursor = document.getElementById('cursor');
    const sig = document.getElementById('sig');
    wrap.classList.add('show');

    let i = 0;
    function type(){
      if(i <= letterText.length){
        body.textContent = letterText.slice(0, i);
        body.appendChild(cursor);
        i++;
        setTimeout(type, 18);
      } else {
        cursor.style.display = 'none';
        sig.classList.add('show');
      }
    }
    type();
  }

  document.getElementById('skip').addEventListener('click', ()=>{
    frame = revealAt;
  });
})();
</script>

</body>
</html>
